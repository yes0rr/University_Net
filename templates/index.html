<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Поиск ВУЗов России</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <div class="brand-icon">🎓</div>
            <div class="brand-title">
                <h1>Поиск ВУЗов России</h1>
                <p>MAX Mini App — Нажмите на город или регион</p>
            </div>
        </div>

        <div id="region-indicator" class="region-indicator">
            <span class="icon">📍</span>
            <span id="region-name-text">Наведите на регион карты</span>
        </div>
    </header>

    <main class="main-container">
        <!-- Боковая панель ВУЗов -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 id="selected-region-title" class="sidebar-title">Выберите регион</h2>
                <p id="selected-city-text" class="sidebar-subtitle">Кликните по карте для загрузки ВУЗов</p>
            </div>

            <div id="universities-container" class="universities-list">
                <div class="empty-state">
                    <div class="empty-state-icon">🗺️</div>
                    <p>Нажмите на любой регион или город на карте, чтобы увидеть ВУЗы и проходные баллы.</p>
                </div>
            </div>
        </aside>

        <!-- Карта России -->
        <section class="map-wrapper">
            <svg id="russia-map" class="svg-map-container" viewBox="0 0 1000 550" xmlns="http://www.w3.org/2000/svg">
                <g id="regions-group">
                    <path class="region-path" id="RU-KGD" data-name="Калининградская область" data-city="Калининград" d="M 40 180 L 60 175 L 70 190 L 50 200 Z"/>
                    <path class="region-path" id="RU-SPE" data-name="Санкт-Петербург & Ленинградская обл." data-city="Санкт-Петербург" d="M 170 110 L 210 100 L 220 130 L 180 140 Z"/>
                    <path class="region-path" id="RU-MOW" data-name="Москва & Московская область" data-city="Москва" d="M 180 170 L 220 165 L 225 195 L 185 200 Z"/>
                    <path class="region-path" id="RU-KDA" data-name="Краснодарский край" data-city="Краснодар" d="M 100 270 L 135 260 L 145 295 L 110 305 Z"/>
                    <path class="region-path" id="RU-TAT" data-name="Республика Татарстан" data-city="Казань" d="M 230 190 L 270 185 L 275 220 L 235 225 Z"/>
                    <path class="region-path" id="RU-SVE" data-name="Свердловская область" data-city="Екатеринбург" d="M 325 170 L 375 160 L 380 215 L 330 220 Z"/>
                    <path class="region-path" id="RU-NVR" data-name="Новосибирская область" data-city="Новосибирск" d="M 465 215 L 515 210 L 520 255 L 470 260 Z"/>
                    <path class="region-path" id="RU-KYA" data-name="Красноярский край" data-city="Красноярск" d="M 535 50 L 640 40 L 650 280 L 540 285 Z"/>
                    <path class="region-path" id="RU-PRI" data-name="Приморский край" data-city="Владивосток" d="M 845 295 L 885 290 L 890 360 L 850 365 Z"/>
                </g>

                <g id="cities-group">
                    <circle class="city-marker" data-region="RU-MOW" cx="205" cy="180" r="5" />
                    <text class="city-label" x="180" y="170">Москва</text>

                    <circle class="city-marker" data-region="RU-SPE" cx="195" cy="120" r="5" />
                    <text class="city-label" x="145" y="115">СПб</text>

                    <circle class="city-marker" data-region="RU-TAT" cx="250" cy="205" r="4.5" />
                    <text class="city-label" x="255" y="205">Казань</text>

                    <circle class="city-marker" data-region="RU-SVE" cx="350" cy="190" r="4.5" />
                    <text class="city-label" x="355" y="190">Екатеринбург</text>

                    <circle class="city-marker" data-region="RU-NVR" cx="490" cy="235" r="4.5" />
                    <text class="city-label" x="495" y="235">Новосибирск</text>
                </g>
            </svg>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const regionPaths = document.querySelectorAll('.region-path');
            const cityMarkers = document.querySelectorAll('.city-marker');
            const regionIndicatorText = document.getElementById('region-name-text');
            const selectedRegionTitle = document.getElementById('selected-region-title');
            const selectedCityText = document.getElementById('selected-city-text');
            const universitiesContainer = document.getElementById('universities-container');

            let activePath = null;

            regionPaths.forEach(path => {
                path.addEventListener('mouseenter', () => {
                    const name = path.getAttribute('data-name');
                    const city = path.getAttribute('data-city');
                    regionIndicatorText.textContent = `${name} (Центр: ${city})`;
                });

                path.addEventListener('mouseleave', () => {
                    if (!activePath) {
                        regionIndicatorText.textContent = 'Наведите на регион карты';
                    } else {
                        regionIndicatorText.textContent = `Выбран: ${activePath.getAttribute('data-name')}`;
                    }
                });

                path.addEventListener('click', () => {
                    if (activePath) activePath.classList.remove('active');
                    path.classList.add('active');
                    activePath = path;

                    loadUniversities(path.id, path.getAttribute('data-name'), path.getAttribute('data-city'));
                });
            });

            cityMarkers.forEach(marker => {
                marker.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const path = document.getElementById(marker.getAttribute('data-region'));
                    if (path) path.dispatchEvent(new Event('click'));
                });
            });

            async function loadUniversities(code, name, city) {
                selectedRegionTitle.textContent = name;
                selectedCityText.textContent = `Главные ВУЗы г. ${city}`;
                universitiesContainer.innerHTML = '<div class="empty-state"><p>Загрузка ВУЗов...</p></div>';

                try {
                    const res = await fetch(`/api/universities/${code}`);
                    const data = await res.json();
                    renderUniversities(data.universities);
                } catch {
                    universitiesContainer.innerHTML = '<div class="empty-state"><p>Ошибка загрузки</p></div>';
                }
            }

            function renderUniversities(unis) {
                universitiesContainer.innerHTML = unis.map(uni => `
                    <div class="uni-card">
                        <span class="uni-badge">${uni.badge}</span>
                        <h3 class="uni-name">${uni.name}</h3>
                        <div class="uni-stats">
                            <div class="stat-item">
                                <span class="stat-label">Мест</span>
                                <span class="stat-value">${uni.budget_places}</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Мин. балл</span>
                                <span class="stat-value">${uni.min_score}</span>
                            </div>
                        </div>
                        <a href="${uni.site}" target="_blank" class="uni-link">Перейти на сайт →</a>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
